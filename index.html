<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <!-- 下面 title / description / favicon 只是「无 JS 与爬虫兜底」的静态值，
         正常显示时由 js/config.js 覆盖，改配置请以 config.js 为准 -->
    <meta name="description" content="Leapan's HomePage">
    <title>Leapan's HomePage—数字田园的悠然漫步</title>
    <link rel="shortcut icon" href="https://files.seeusercontent.com/2026/04/18/jP7s/icon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">   
    <link rel="stylesheet" href="https://s4.zstatic.net/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
    <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <link rel="stylesheet" href="css/style.css?v=20260927">
    <script src="js/config.js?v=20260927" defer></script>
    <script src="js/loading.js?v=20260911" defer></script>
    <script src="js/Tilt-Animation.js?v=20260911" defer></script>
    <script src="js/Typewriter.js?v=20260406" defer></script>
    <script src="js/click-particle.js?v=20260911" async></script>
    <script src="js/yiyan.js?v=20260911"async></script>
    <script src="js/Sitetime.js?v=20260406" defer></script> <!-- 采用版本号来破坏CDN缓存 -->
    <noscript>
        <!-- 兜底块，防止卡死qwq-->
        <style>
            .loading-mask { display: none !important; }
            #typewriter { opacity: 1 !important; }
            #uptime { display: none !important; }
        </style>
    </noscript>
</head>
<body>
    <div class="bg" id="bg"></div>
    <!-- 左右开屏加载的遮罩 -->
    <div class="loading-mask" id="loadingMask">
        <div class="mask-left"></div>
        <div class="mask-right"></div>
        <!-- 加载动画容器 -->
        <div class="load_15" id="loaderContainer">
            <div class="sk-cube sk-cube1"></div>
            <div class="sk-cube sk-cube2"></div>
            <div class="sk-cube sk-cube3"></div>
            <div class="sk-cube sk-cube4"></div>
            <div class="sk-cube sk-cube5"></div>
            <div class="sk-cube sk-cube6"></div>
            <div class="sk-cube sk-cube7"></div>
            <div class="sk-cube sk-cube8"></div>
            <div class="sk-cube sk-cube9"></div>
        </div>
        <div class="description-text">
            <h1></h1><br><h2>Loading...</h2>
        </div>
    </div>
    <!-- 卡片与页脚里的文字/链接全部由 js/config.js 注入，不要在这里重复写死 -->
    <!--主卡片区域-->
    <div class="main-card" id="MainCard">      
        <div class="avatar"></div>
        <h1 class="name"></h1>
        <div class="bar">
            <p class="typewriter" id="typewriter"></p>
        </div>
        <div class="social-icons"></div>
        <div class="footer-links"></div>
    </div>
    <!--页脚版权提示-->
    <div class="copyright">
        <p class="copyright-links"></p>
    <div class="yiyan" id="yiyan"></div>
    <div class="uptime-line">
        <span class="uptime" id="uptime">加载中...</span>
    </div>
    <!-- 版权文字容器：config.js 靠「.copyright 下第一个非 .yiyan/.uptime-line 的 div」定位，勿删 -->
    <div></div>
    </div>
</body>
</html>
